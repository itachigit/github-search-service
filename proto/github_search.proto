syntax = "proto3";

package githubsearch;

// 👇 Replace the import path below with your actual repo/module path
option go_package = "github.com/itachigit/github-search-service/githubsearchpb";

service GithubSearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string search_term = 1;
  string user = 2;
}

message SearchResponse {
  repeated Result results = 1;
}

message Result {
  string file_url = 1;
  string repo = 2;
}
